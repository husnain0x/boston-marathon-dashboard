name: Keep Render Awake

# Pings the live dashboard on a schedule so the Render free-tier
# service doesn't spin down (which causes the ~20-30s cold start).
on:
  schedule:
    # Every 10 minutes. Note: GitHub may delay cron under heavy load.
    - cron: "*/10 * * * *"
  workflow_dispatch: {} # allow manual trigger from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping dashboard URL
        run: |
          URL="https://boston-marathon-dashboard.onrender.com"
          echo "Pinging $URL ..."
          code=$(curl -s -o /dev/null -w "%{http_code}" -L --max-time 60 "$URL")
          echo "HTTP $code"
          if [ "$code" -ge 200 ] && [ "$code" -lt 400 ]; then
            echo "Service is awake."
          else
            echo "Unexpected status $code (service may be booting)."
          fi
